name: Atualizar catálogo de canais saudáveis

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerar catálogo com streams online
        run: python3 scripts/import_channels.py

      - name: Publicar somente se houver alteração
        run: |
          if git diff --quiet -- channels.json; then
            echo "Catálogo sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git commit -m "chore: atualizar catálogo de streams saudáveis"
          git push
